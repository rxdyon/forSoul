<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QR-коды · Владивосток</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: #05070f;
    color: #fff;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 15% 15%, rgba(0,210,255,.1) 0%, transparent 50%),
      radial-gradient(circle at 85% 85%, rgba(131,56,236,.08) 0%, transparent 55%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(rgba(255,255,255,.008) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(255,255,255,.008) 1px, transparent 1px) 0 0 / 40px 40px;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    padding-top: max(40px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }

  .title {
    font-size: 13px;
    font-weight: 700;
    color: #00d2ff;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(24px, 3.6vw, 48px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-align: center;
    line-height: 1.1;
  }

  h1 span {
    display: block;
    font-size: clamp(14px, 1.6vw, 24px);
    font-weight: 400;
    color: #00d2ff;
    letter-spacing: 2px;
    text-transform: none;
    margin-top: 8px;
  }

  .sub {
    font-size: 14px;
    color: #7e8b9b;
    margin-bottom: 50px;
    text-align: center;
    letter-spacing: 1px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    max-width: 900px;
    width: 100%;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .qr-frame {
    padding: 6px;
    border-radius: 24px;
    background: linear-gradient(135deg, #00d2ff 0%, #8338ec 50%, #ff006e 100%);
    box-shadow: 0 0 50px rgba(131,56,236,.5), 0 20px 50px rgba(0,0,0,.7);
    animation: qrPulse 3s ease-in-out infinite;
    transition: transform .4s ease;
  }

  @keyframes qrPulse {
    0%, 100% { box-shadow: 0 0 50px rgba(0,210,255,.5), 0 20px 50px rgba(0,0,0,.7); }
    50%      { box-shadow: 0 0 70px rgba(131,56,236,.8), 0 20px 50px rgba(0,0,0,.7); }
  }

  .qr-inner {
    background: #05070f;
    border-radius: 20px;
    padding: 14px;
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-inner img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  .qr-label {
    margin-top: 24px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #00d2ff;
  }

  .qr-desc {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    max-width: 320px;
  }

  .qr-desc a {
    color: #8338ec;
    text-decoration: none;
    font-weight: 700;
  }

  .card.ask .qr-label { color: #ff006e; }
  .card.ask .qr-desc a { color: #ff006e; }

  @media (max-width: 900px) {
    .container {
      padding: 24px 16px;
      justify-content: flex-start;
      gap: 8px;
    }
    .grid {
      grid-template-columns: 1fr;
      gap: 36px;
      max-width: 100%;
      margin-top: 20px;
    }
    .qr-inner {
      width: min(78vw, 340px);
      height: min(78vw, 340px);
      padding: 10px;
    }
    h1 { font-size: 22px; }
    h1 span { font-size: 13px; }
    .sub { margin-bottom: 24px; font-size: 12px; }
    .title { font-size: 11px; letter-spacing: 3px; margin-bottom: 8px; }
    .qr-label { margin-top: 18px; font-size: 11px; }
    .qr-desc { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title">QR-коды</div>
    <h1>Владивосток<span>Наведите камеру телефона</span></h1>
    <div class="sub">презентация и вопросы — по одному клику</div>

    <div class="grid">
      <div class="card">
        <div class="qr-frame">
          <div class="qr-inner">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=800x800&margin=10&color=ffffff&bgcolor=05070f&data=https%3A%2F%2Frxdyon.github.io%2FforSoul%2F" alt="QR на презентацию">
          </div>
        </div>
        <div class="qr-label">01 / Презентация</div>
        <div class="qr-desc">Открыть сайт с презентацией<br><a href="https://rxdyon.github.io/forSoul/" target="_blank" rel="noopener">rxdyon.github.io/forSoul</a></div>
      </div>

      <div class="card ask">
        <div class="qr-frame">
          <div class="qr-inner">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=800x800&margin=10&color=ffffff&bgcolor=05070f&data=https%3A%2F%2Frxdyon.github.io%2FforSoul%2F%3Fask" alt="QR на вопросы">
          </div>
        </div>
        <div class="qr-label">02 / Вопросы спикерам</div>
        <div class="qr-desc">Задать вопрос в эфир<br><a href="https://rxdyon.github.io/forSoul/?ask" target="_blank" rel="noopener">rxdyon.github.io/forSoul/?ask</a></div>
      </div>
    </div>
  </div>
</body>
</html>
