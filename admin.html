<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель · Владивосток</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Montserrat', sans-serif;
    background: #05070f; color: #fff;
    min-height: 100dvh; padding: 20px;
  }
  h1 { font-size: 22px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
    background: linear-gradient(90deg, #00d2ff, #8338ec, #ff006e);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 12px; color: #7e8b9b; margin-bottom: 22px; }

  .panel {
    background: rgba(10,14,28,.85);
    border: 1px solid rgba(0,210,255,.2);
    border-radius: 16px;
    padding: 20px; margin-bottom: 20px;
    backdrop-filter: blur(20px);
  }
  .panel h2 {
    font-size: 11px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; color: #00d2ff; margin-bottom: 14px;
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  .stat {
    background: rgba(5,7,15,.6);
    border: 1px solid rgba(0,210,255,.15);
    border-radius: 12px; padding: 14px; text-align: center;
  }
  .stat .num { font-size: 28px; font-weight: 900; color: #00d2ff; line-height: 1; }
  .stat .lbl { font-size: 10px; color: #7e8b9b; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; }

  .slider-ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .slider-ctrl button {
    background: rgba(0,210,255,.1);
    border: 1px solid rgba(0,210,255,.3);
    color: #00d2ff; padding: 12px 20px; border-radius: 12px;
    font-family: inherit; font-size: 13px; font-weight: 900; letter-spacing: 1px;
    cursor: pointer; transition: all .25s ease;
  }
  .slider-ctrl button:hover { background: #00d2ff; color: #05070f; }
  .slider-ctrl select {
    background: rgba(5,7,15,.9); color: #fff;
    border: 1px solid rgba(0,210,255,.3);
    padding: 12px 16px; border-radius: 12px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    outline: none;
  }

  .qlist { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 6px; }
  .qlist::-webkit-scrollbar { width: 6px; }
  .qlist::-webkit-scrollbar-thumb { background: rgba(0,210,255,.3); border-radius: 3px; }

  .qitem {
    background: rgba(5,7,15,.6);
    border: 1px solid rgba(255,255,255,.06);
    border-left: 3px solid #00d2ff;
    border-radius: 0 12px 12px 0;
    padding: 12px 16px; transition: opacity .3s ease;
  }
  .qitem.hidden { opacity: .35; border-left-color: #7e8b9b; }
  .qitem.answered { border-left-color: #22c55e; }
  .qitem-head {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 900; color: #00d2ff; letter-spacing: .5px;
    text-transform: uppercase; margin-bottom: 6px; flex-wrap: wrap;
  }
  .qitem-head .meta { color: #7e8b9b; font-weight: 700; margin-left: auto; font-size: 10px; }
  .qitem-body { font-size: 14px; line-height: 1.45; margin-bottom: 10px; }
  .qitem-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .qitem-actions button {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.15);
    color: #b0b7c6; padding: 6px 12px; border-radius: 8px;
    font-family: inherit; font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .25s ease;
  }
  .qitem-actions button:hover { color: #fff; border-color: #00d2ff; }

  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters button {
    background: transparent; border: 1px solid rgba(0,210,255,.25);
    color: #b0b7c6; padding: 8px 14px; border-radius: 20px;
    font-family: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .25s ease;
  }
  .filters button.active { background: #00d2ff; color: #05070f; border-color: #00d2ff; }

  .danger-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .danger-buttons button {
    padding: 12px 18px; border-radius: 12px;
    font-family: inherit; font-size: 11px; font-weight: 900;
    letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; border: 1px solid; background: transparent;
    transition: all .25s ease;
  }
  .btn-warn { color: #ffb100; border-color: rgba(255,177,0,.35); }
  .btn-warn:hover { background: #ffb100; color: #05070f; }
  .btn-danger { color: #ff006e; border-color: rgba(255,0,110,.4); }
  .btn-danger:hover { background: #ff006e; color: #fff; }
  .btn-info { color: #00d2ff; border-color: rgba(0,210,255,.4); }
  .btn-info:hover { background: #00d2ff; color: #05070f; }
  .btn-ok { color: #22c55e; border-color: rgba(34,197,94,.4); }
  .btn-ok:hover { background: #22c55e; color: #05070f; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(0,210,255,.15); border: 1px solid #00d2ff; color: #00d2ff;
    padding: 12px 24px; border-radius: 30px;
    font-size: 12px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
    opacity: 0; transition: all .3s ease; pointer-events: none; z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: #ff006e; color: #ff006e; background: rgba(255,0,110,.15); }

  .refresh-status { font-size: 10px; color: #7e8b9b; letter-spacing: 1px; text-transform: uppercase; margin-top: 6px; }

  .login-view {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, rgba(0,210,255,.08), transparent 60%), #05070f;
    z-index: 100; padding: 20px;
  }
  .login-view.hidden { display: none; }
  .login-card {
    width: 100%; max-width: 400px;
    background: rgba(10,14,28,.9);
    border: 1px solid rgba(0,210,255,.25);
    border-radius: 20px; padding: 28px 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
  }
  .login-card h2 {
    font-size: 18px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #00d2ff, #8338ec);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-card .hint { font-size: 12px; color: #7e8b9b; margin-bottom: 20px; }
  .login-card input {
    width: 100%; padding: 14px 16px; margin-bottom: 12px;
    background: rgba(5,7,15,.75);
    border: 1px solid rgba(0,210,255,.25);
    border-radius: 12px; color: #fff;
    font-family: inherit; font-size: 15px; outline: none;
  }
  .login-card input:focus { border-color: #00d2ff; box-shadow: 0 0 0 3px rgba(0,210,255,.15); }
  .login-card button {
    width: 100%; padding: 14px;
    border: none; border-radius: 30px;
    background: linear-gradient(135deg, #00d2ff, #8338ec);
    color: #fff; font-family: inherit;
    font-size: 12px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0,210,255,.35);
  }
  .login-card button:active { transform: scale(.97); }

  .user-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px;
    font-size: 11px; color: #7e8b9b;
    letter-spacing: 1.5px; text-transform: uppercase;
    font-weight: 700; flex-wrap: wrap;
  }
  .user-bar .role {
    padding: 3px 10px; border-radius: 12px;
    background: rgba(0,210,255,.15); color: #00d2ff;
  }
  .user-bar .role.admin { background: rgba(255,0,110,.15); color: #ff006e; }
  .user-bar .role.moderator { background: rgba(255,177,0,.15); color: #ffb100; }
  .user-bar a { color: #ff006e; cursor: pointer; font-weight: 900; text-decoration: none; }
  .user-bar a:hover { color: #fff; }

  .emp-row {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 14px;
    background: rgba(5,7,15,.6);
    border: 1px solid rgba(255,255,255,.06);
    border-left: 3px solid #00d2ff;
    border-radius: 0 12px 12px 0;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .emp-row.inactive { opacity: .5; }
  .emp-row .name { font-weight: 900; color: #fff; }
  .emp-row .login { color: #7e8b9b; font-size: 11px; }
  .emp-row .role-tag {
    padding: 2px 10px; border-radius: 12px; font-size: 10px;
    font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
  }
  .role-tag.admin { background: rgba(255,0,110,.15); color: #ff006e; }
  .role-tag.moderator { background: rgba(255,177,0,.15); color: #ffb100; }
  .role-tag.viewer { background: rgba(126,139,155,.2); color: #b0b7c6; }
  .emp-row .actions { margin-left: auto; display: flex; gap: 6px; }
  .emp-row .actions button {
    background: transparent;
    border: 1px solid rgba(255,255,255,.15);
    color: #b0b7c6;
    padding: 5px 10px; border-radius: 8px;
    font-family: inherit; font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer;
  }
  .emp-row .actions button:hover { color: #fff; border-color: #00d2ff; }

  .add-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .add-form input, .add-form select {
    width: 100%; padding: 10px 14px;
    background: rgba(5,7,15,.75);
    border: 1px solid rgba(0,210,255,.25);
    border-radius: 10px; color: #fff;
    font-family: inherit; font-size: 13px; outline: none;
  }
  .add-form button {
    grid-column: span 2;
    padding: 12px;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, #00d2ff, #8338ec);
    color: #fff; font-family: inherit;
    font-size: 12px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer;
  }

  .log-row {
    padding: 8px 12px;
    background: rgba(5,7,15,.6);
    border-left: 3px solid #8338ec;
    border-radius: 0 8px 8px 0;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .log-row .who { color: #00d2ff; font-weight: 900; }
  .log-row .what { color: #ff006e; font-weight: 700; }
  .log-row .when { color: #7e8b9b; font-size: 10px; }
</style>
</head>
<body>

<div class="login-view" id="loginView">
  <div class="login-card">
    <h2>Вход в админку</h2>
    <div class="hint">Введите логин и пароль сотрудника</div>
    <input type="text" id="loginInput" placeholder="Логин" autocomplete="username">
    <input type="password" id="passInput" placeholder="Пароль" autocomplete="current-password">
    <button onclick="tryLogin()">Войти</button>
  </div>
</div>

<div id="mainView" style="display:none;">
  <div class="user-bar">
    <span id="userName">—</span>
    <span class="role" id="userRole">—</span>
    <a onclick="logout()">Выйти</a>
  </div>

  <h1>Админ-панель</h1>
  <div class="sub">Управление презентацией в реальном времени</div>

  <div class="panel">
    <h2>Статистика</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="stTotal">—</div><div class="lbl">Всего</div></div>
      <div class="stat"><div class="num" id="stHour">—</div><div class="lbl">За час</div></div>
      <div class="stat"><div class="num" id="stHidden">—</div><div class="lbl">Скрыто</div></div>
      <div class="stat"><div class="num" id="stAnswered">—</div><div class="lbl">Отвечено</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Управление слайдами</h2>
    <div class="slider-ctrl">
      <button onclick="gotoSlide(currentSlide - 1)">← Назад</button>
      <select id="slideSelect">
        <option value="0">00 · Спойлер</option>
        <option value="1">01 · Визитка</option>
        <option value="2">02 · Мосты</option>
        <option value="3">03 · Крепость</option>
        <option value="4">04 · Природа</option>
        <option value="5">05 · Погружение</option>
        <option value="6">06 · Опрос</option>
        <option value="7">07 · Контакты</option>
      </select>
      <button onclick="gotoSlide(currentSlide + 1)">Вперёд →</button>
      <span class="refresh-status">Текущий: <b id="currentSlideLabel">0</b></span>
    </div>
  </div>

  <div class="panel">
    <h2>Вопросы из зала</h2>
    <div class="filters">
      <button data-filter="all" class="active">Все</button>
      <button data-filter="new">Новые</button>
      <button data-filter="answered">Отвеченные</button>
      <button data-filter="hidden">Скрытые</button>
    </div>
    <div class="qlist" id="qlist">
      <div style="color:#7e8b9b;font-size:12px;text-align:center;padding:20px;">Загрузка...</div>
    </div>
  </div>

  <div class="panel">
    <h2>Действия</h2>
    <div class="danger-buttons">
      <button class="btn-info" onclick="exportCsv()">📥 Экспорт CSV</button>
      <button class="btn-warn" onclick="clearHidden()">🧹 Удалить скрытые</button>
      <button class="btn-danger" onclick="clearAll()">🗑 Удалить все</button>
      <button class="btn-info" onclick="enableNotifications()">🔔 Уведомления</button>
    </div>
  </div>

  <div class="panel" id="employeesPanel" style="display:none;">
    <h2>Сотрудники</h2>
    <div id="employeesList"></div>
    <div class="add-form">
      <input type="text" id="newEmpName" placeholder="Имя">
      <input type="text" id="newEmpLogin" placeholder="Логин">
      <input type="text" id="newEmpPassword" placeholder="Пароль">
      <select id="newEmpRole">
        <option value="viewer">viewer</option>
        <option value="moderator">moderator</option>
        <option value="admin">admin</option>
      </select>
      <button onclick="addEmployee()">Добавить сотрудника</button>
    </div>
  </div>

  <div class="panel" id="logPanel" style="display:none;">
    <h2>Лог действий</h2>
    <div id="logList"></div>
  </div>

  <div class="panel">
    <h2>Профиль</h2>
    <div class="danger-buttons">
      <button class="btn-info" onclick="changeMyPassword()">🔒 Сменить пароль</button>
      <button class="btn-info" onclick="toggleEmployees()">👥 Сотрудники</button>
      <button class="btn-info" onclick="toggleLog()">📜 Лог действий</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const ADMIN_URL = 'https://script.google.com/macros/s/AKfycbySBLoyfblHdstXSdrfLsLDufwLijiVLdWlPPg63S1RgSb42hLuJaOOQC8zBGPuhh8SyQ/exec';

  let currentEmp = null;
  let currentSlide = 0;
  let currentFilter = 'all';
  let allQuestions = [];
  let lastSeenCount = 0;
  let notificationsEnabled = false;

  function showToast(msg, isErr) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function adminPost(payload) {
    if (currentEmp) {
      payload.login = currentEmp.login;
      payload.password = currentEmp.password;
    }
    try {
      const res = await fetch(ADMIN_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      });
      return await res.json();
    } catch (err) {
      showToast('Ошибка: ' + err.message, true);
      return { ok: false };
    }
  }

  async function tryLogin() {
    const login = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('passInput').value;
    if (!login || !password) return;
    const res = await fetch(ADMIN_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', login, password }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    }).then(r => r.json()).catch(() => ({ ok: false }));
    if (res.ok) {
      currentEmp = { ...res.employee, password };
      sessionStorage.setItem('vld_emp', JSON.stringify(currentEmp));
      enterPanel();
    } else {
      showToast('Неверный логин или пароль', true);
    }
  }

  function logout() {
    sessionStorage.removeItem('vld_emp');
    location.reload();
  }

  function enterPanel() {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('mainView').style.display = 'block';
    document.getElementById('userName').textContent = currentEmp.name || currentEmp.login;
    const roleEl = document.getElementById('userRole');
    roleEl.textContent = currentEmp.role;
    roleEl.className = 'role ' + currentEmp.role;

    if (currentEmp.role !== 'admin') {
      document.querySelectorAll('.btn-warn, .btn-danger').forEach(b => b.style.display = 'none');
    }

    if (currentEmp.role !== 'admin' && currentEmp.role !== 'moderator') {
      document.querySelectorAll('.qitem-actions button').forEach(b => b.style.display = 'none');
      document.querySelectorAll('.slider-ctrl button').forEach(b => b.style.display = 'none');
      document.getElementById('slideSelect').disabled = true;
    }

    loadSlide();
    loadQuestions();
    loadStats();

    setInterval(loadQuestions, 5000);
    setInterval(loadStats, 10000);
    setInterval(loadSlide, 3000);
  }

  async function gotoSlide(n) {
    if (n < 0) n = 7;
    if (n > 7) n = 0;
    currentSlide = n;
    document.getElementById('slideSelect').value = String(n);
    document.getElementById('currentSlideLabel').textContent = String(n);
    await adminPost({ action: 'goto', slide: n });
    showToast('Слайд ' + n);
  }

  document.getElementById('slideSelect').addEventListener('change', e => {
    gotoSlide(parseInt(e.target.value, 10));
  });

  async function loadQuestions() {
    try {
      const res = await fetch(ADMIN_URL, { cache: 'no-store' });
      const data = await res.json();
      if (Array.isArray(data)) {
        const fresh = data.filter(q => q.text);
        const last = fresh[fresh.length - 1];
        if (last && last.id && lastSeenCount > 0 && fresh.length > lastSeenCount) {
          notifyNewQuestion(last);
        }
        lastSeenCount = fresh.length;
        allQuestions = data;
        renderQuestions();
      }
    } catch (err) {}
  }

  function notifyNewQuestion(q) {
    if (!notificationsEnabled) return;
    if (Notification.permission === 'granted') {
      new Notification('Новый вопрос', { body: (q.name || 'Аноним') + ': ' + (q.text || '') });
    }
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    } catch (e) {}
  }

  async function enableNotifications() {
    if (!('Notification' in window)) { showToast('Не поддерживается', true); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { notificationsEnabled = true; showToast('Уведомления включены'); }
    else { showToast('Разрешение не выдано', true); }
  }

  async function loadStats() {
    const data = await adminPost({ action: 'stats' });
    if (!data.ok) return;
    document.getElementById('stTotal').textContent = data.total;
    document.getElementById('stHour').textContent = data.lastHour;
    document.getElementById('stHidden').textContent = data.hidden;
    document.getElementById('stAnswered').textContent = data.answered;
  }

  async function loadSlide() {
    const data = await adminPost({ action: 'getSlide' });
    if (data.ok) {
      currentSlide = data.slide;
      document.getElementById('slideSelect').value = String(currentSlide);
      document.getElementById('currentSlideLabel').textContent = String(currentSlide);
    }
  }

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderQuestions() {
    const list = document.getElementById('qlist');
    let items = allQuestions.slice().reverse();
    if (currentFilter === 'new') items = items.filter(q => !q.hidden && !q.answered);
    if (currentFilter === 'answered') items = items.filter(q => q.answered);
    if (currentFilter === 'hidden') items = items.filter(q => q.hidden);

    if (!items.length) {
      list.innerHTML = '<div style="color:#7e8b9b;font-size:12px;text-align:center;padding:20px;">Пусто</div>';
      return;
    }

    list.innerHTML = items.map(q => `
      <div class="qitem ${q.hidden ? 'hidden' : ''} ${q.answered ? 'answered' : ''}">
        <div class="qitem-head">
          <span>${escapeHtml(q.name || 'Аноним')}</span>
          <span class="meta">${fmtTime(q.time)} · слайд ${q.slide ?? '—'}</span>
        </div>
        <div class="qitem-body">${escapeHtml(q.text || '')}</div>
        <div class="qitem-actions">
          ${q.answered
            ? `<button onclick="unanswerQ('${q.id}')">↺ Снять</button>`
            : `<button onclick="answerQ('${q.id}')">✓ Ответил</button>`}
          ${q.hidden
            ? `<button onclick="unhideQ('${q.id}')">↺ Показать</button>`
            : `<button onclick="hideQ('${q.id}')">✕ Скрыть</button>`}
        </div>
      </div>
    `).join('');
  }

  async function hideQ(id) { await adminPost({ action: 'hideQuestion', id }); await refresh(); }
  async function unhideQ(id) { await adminPost({ action: 'unhideQuestion', id }); await refresh(); }
  async function answerQ(id) { await adminPost({ action: 'answerQuestion', id }); await refresh(); }
  async function unanswerQ(id) { await adminPost({ action: 'unanswerQuestion', id }); await refresh(); }

  async function refresh() { await loadQuestions(); await loadStats(); }

  async function clearHidden() {
    if (!confirm('Удалить все скрытые?')) return;
    const data = await adminPost({ action: 'clearHidden' });
    if (data.ok) { showToast('Удалено: ' + data.removed); await refresh(); }
  }

  async function clearAll() {
    if (!confirm('Удалить ВСЕ вопросы?')) return;
    const data = await adminPost({ action: 'clearAll' });
    if (data.ok) { showToast('Всё удалено'); lastSeenCount = 0; await refresh(); }
  }

  async function exportCsv() {
    const data = await adminPost({ action: 'exportCsv' });
    if (!data.ok) { showToast('Ошибка', true); return; }
    const blob = new Blob([data.csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'voprosy-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('CSV скачан');
  }

  async function changeMyPassword() {
    const p = prompt('Новый пароль (минимум 6 символов):');
    if (!p || p.length < 6) return;
    const data = await adminPost({ action: 'changePassword', newPassword: p });
    if (data.ok) { showToast('Пароль изменён'); currentEmp.password = p; sessionStorage.setItem('vld_emp', JSON.stringify(currentEmp)); }
    else showToast('Ошибка: ' + data.error, true);
  }

  function toggleEmployees() {
    const p = document.getElementById('employeesPanel');
    if (p.style.display === 'none') {
      p.style.display = 'block';
      loadEmployees();
    } else p.style.display = 'none';
  }

  function toggleLog() {
    const p = document.getElementById('logPanel');
    if (p.style.display === 'none') {
      p.style.display = 'block';
      loadLog();
    } else p.style.display = 'none';
  }

  async function loadEmployees() {
    const data = await adminPost({ action: 'listEmployees' });
    if (!data.ok) { document.getElementById('employeesList').innerHTML = '<div style="color:#ff006e;font-size:12px;">Доступ запрещён</div>'; return; }
    const el = document.getElementById('employeesList');
    if (!data.employees.length) { el.innerHTML = '<div style="color:#7e8b9b;font-size:12px;">Пусто</div>'; return; }
    el.innerHTML = data.employees.map(e => `
      <div class="emp-row ${e.active ? '' : 'inactive'}">
        <span class="name">${escapeHtml(e.name)}</span>
        <span class="login">@${escapeHtml(e.login)}</span>
        <span class="role-tag ${e.role}">${e.role}</span>
        ${!e.active ? '<span class="login">(отключён)</span>' : ''}
        <div class="actions">
          <button onclick="changeRole('${e.id}')">Роль</button>
          <button onclick="toggleEmp('${e.id}')">${e.active ? 'Откл.' : 'Вкл.'}</button>
          <button onclick="removeEmp('${e.id}')">Удалить</button>
        </div>
      </div>
    `).join('');
  }

  async function addEmployee() {
    const name = document.getElementById('newEmpName').value.trim();
    const login = document.getElementById('newEmpLogin').value.trim();
    const password = document.getElementById('newEmpPassword').value;
    const role = document.getElementById('newEmpRole').value;
    if (!login || !password) { showToast('Логин и пароль обязательны', true); return; }
    const data = await adminPost({ action: 'addEmployee', name, login, password, role });
    if (data.ok) { showToast('Добавлен'); loadEmployees(); }
    else showToast('Ошибка: ' + data.error, true);
  }

  async function removeEmp(id) {
    if (!confirm('Удалить сотрудника?')) return;
    const data = await adminPost({ action: 'removeEmployee', id });
    if (data.ok) { showToast('Удалён'); loadEmployees(); }
    else showToast('Ошибка: ' + data.error, true);
  }

  async function toggleEmp(id) {
    const data = await adminPost({ action: 'toggleEmployee', id });
    if (data.ok) loadEmployees();
  }

  async function changeRole(id) {
    const role = prompt('Новая роль (admin / moderator / viewer):');
    if (!role) return;
    const data = await adminPost({ action: 'changeRole', id, role });
    if (data.ok) { showToast('Роль изменена'); loadEmployees(); }
  }

  async function loadLog() {
    const data = await adminPost({ action: 'getLog' });
    if (!data.ok) { document.getElementById('logList').innerHTML = '<div style="color:#ff006e;font-size:12px;">Доступ запрещён</div>'; return; }
    const el = document.getElementById('logList');
    if (!data.log.length) { el.innerHTML = '<div style="color:#7e8b9b;font-size:12px;">Пусто</div>'; return; }
    el.innerHTML = data.log.map(l => `
      <div class="log-row">
        <span class="when">${fmtTime(l.time)}</span>
        <span class="who">${escapeHtml(l.login)}</span>
        <span class="what">${escapeHtml(l.action)}</span>
        ${l.object ? '<span>→ ' + escapeHtml(l.object) + '</span>' : ''}
        ${l.details ? '<span style="color:#7e8b9b;"> ' + escapeHtml(l.details) + '</span>' : ''}
      </div>
    `).join('');
  }

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderQuestions();
    });
  });

  const saved = sessionStorage.getItem('vld_emp');
  if (saved) {
    try {
      currentEmp = JSON.parse(saved);
      enterPanel();
    } catch (e) {}
  }
</script>
</body>
</html>
